[versions]
kotlin = "2.4.21"
kreate = "5.5.2"
kore = "2.5.0"
konfetti = "1.1.0"
kontinuity = "1.2.0"
konnect = "1.2.0"
kollect = "1.1.0"
coroutines = "1.11.0"
kotlinx-io = "0.9.3"
serialization = "1.13.0"
# The benchmark runtime is released together with the kotlinx-benchmark plugin that Kreate brings along.
kotlinx-benchmark = "0.5.0"
jmh = "1.37"
# Floors for the classpaths of build tools, raised past known vulnerabilities.
tooling-jackson = "2.23.0"
tooling-bouncycastle = "1.87"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kreate-gradle-plugin = { module = "com.davils.kreate:com.davils.kreate.gradle.plugin", version.ref = "kreate" }
kore-core = { module = "com.davils:kore-core", version.ref = "kore" }
kore-testing = { module = "com.davils:kore-testing", version.ref = "kore" }
konfetti-core = { module = "com.davils:konfetti-core", version.ref = "konfetti" }
konfetti-testing = { module = "com.davils:konfetti-testing", version.ref = "konfetti" }
kollect-core = { module = "com.davils:kollect-core", version.ref = "kollect" }
kontinuity-core = { module = "com.davils:kontinuity-core", version.ref = "kontinuity" }
kontinuity-cache = { module = "com.davils:kontinuity-cache", version.ref = "kontinuity" }
kontinuity-retry = { module = "com.davils:kontinuity-retry", version.ref = "kontinuity" }
konnect-internet-protocol = { module = "com.davils:konnect-internet-protocol", version.ref = "konnect" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

[bundles]
build-logic = [
    "kotlin-gradle-plugin",
    "kreate-gradle-plugin"
]
