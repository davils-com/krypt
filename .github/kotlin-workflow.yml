# What the pipeline of krypt does. Every key overrides a default of
# actions/plan/defaults.yml in davils-com/kotlin-workflow; a key that is not there stops the run.
version: 1
gradle:
  args: ["--stacktrace"]

check:
  tasks: [check]
  reproducible:
    clean-tasks:
      - ":krypt-core:clean"
      - ":krypt-asn1:clean"
      - ":krypt-primitive:clean"
      - ":krypt-keyset:clean"
      - ":krypt-stream:clean"
      - ":krypt-storage:clean"
      - ":krypt-x509:clean"
      - ":krypt-keystore:clean"
      - ":krypt-ct:clean"
      - ":krypt-ocsp:clean"
      - ":krypt-testing:clean"
    tasks:
      - ":krypt-core:jvmJar"
      - ":krypt-asn1:jvmJar"
      - ":krypt-primitive:jvmJar"
      - ":krypt-keyset:jvmJar"
      - ":krypt-stream:jvmJar"
      - ":krypt-storage:jvmJar"
      - ":krypt-x509:jvmJar"
      - ":krypt-keystore:jvmJar"
      - ":krypt-ct:jvmJar"
      - ":krypt-ocsp:jvmJar"
      - ":krypt-testing:jvmJar"
    artifacts:
      - "krypt-core/build/libs/*.jar"
      - "krypt-asn1/build/libs/*.jar"
      - "krypt-primitive/build/libs/*.jar"
      - "krypt-keyset/build/libs/*.jar"
      - "krypt-stream/build/libs/*.jar"
      - "krypt-storage/build/libs/*.jar"
      - "krypt-x509/build/libs/*.jar"
      - "krypt-keystore/build/libs/*.jar"
      - "krypt-ct/build/libs/*.jar"
      - "krypt-ocsp/build/libs/*.jar"
      - "krypt-testing/build/libs/*.jar"

policy:
  # Scheduling, timers and line breaks differ on Windows, and krypt's race and stress tests run real threads, so
  # develop, main and a tag run there too.
  push-develop:
    stages: [check, snapshot]
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  push-main:
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  tag:
    os: [ubuntu-latest, windows-latest]

security:
  gradle:
    tasks:
      - "kreateAssurance"
  dependency-submission:
    enabled: false

publish:
  build-tasks: [assemble]
  tasks:
    - ":krypt-core:publishAllPublicationsToDavilsRepository"
    - ":krypt-asn1:publishAllPublicationsToDavilsRepository"
    - ":krypt-primitive:publishAllPublicationsToDavilsRepository"
    - ":krypt-keyset:publishAllPublicationsToDavilsRepository"
    - ":krypt-stream:publishAllPublicationsToDavilsRepository"
    - ":krypt-storage:publishAllPublicationsToDavilsRepository"
    - ":krypt-x509:publishAllPublicationsToDavilsRepository"
    - ":krypt-keystore:publishAllPublicationsToDavilsRepository"
    - ":krypt-ct:publishAllPublicationsToDavilsRepository"
    - ":krypt-ocsp:publishAllPublicationsToDavilsRepository"
    - ":krypt-testing:publishAllPublicationsToDavilsRepository"
    - ":krypt-bom:publishAllPublicationsToDavilsRepository"

snapshot:
  # krypt's own build makes every build without a release tag a snapshot.
  kreate-snapshot: false

release:
  publications:
    discovery: explicit
    # In upload order: the publication of every target before the multiplatform publication that names them.
    list:
      - path: com/davils/krypt-core-jvm
        artifact: krypt-core-jvm
        task: ":krypt-core:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-core-wasm-js
        artifact: krypt-core-wasm-js
        task: ":krypt-core:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-core
        artifact: krypt-core
        task: ":krypt-core:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-asn1-jvm
        artifact: krypt-asn1-jvm
        task: ":krypt-asn1:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-asn1-wasm-js
        artifact: krypt-asn1-wasm-js
        task: ":krypt-asn1:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-asn1
        artifact: krypt-asn1
        task: ":krypt-asn1:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-primitive-jvm
        artifact: krypt-primitive-jvm
        task: ":krypt-primitive:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-primitive-wasm-js
        artifact: krypt-primitive-wasm-js
        task: ":krypt-primitive:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-primitive
        artifact: krypt-primitive
        task: ":krypt-primitive:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-keyset-jvm
        artifact: krypt-keyset-jvm
        task: ":krypt-keyset:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-keyset-wasm-js
        artifact: krypt-keyset-wasm-js
        task: ":krypt-keyset:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-keyset
        artifact: krypt-keyset
        task: ":krypt-keyset:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-stream-jvm
        artifact: krypt-stream-jvm
        task: ":krypt-stream:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-stream-wasm-js
        artifact: krypt-stream-wasm-js
        task: ":krypt-stream:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-stream
        artifact: krypt-stream
        task: ":krypt-stream:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-storage-jvm
        artifact: krypt-storage-jvm
        task: ":krypt-storage:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-storage-wasm-js
        artifact: krypt-storage-wasm-js
        task: ":krypt-storage:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-storage
        artifact: krypt-storage
        task: ":krypt-storage:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-x509-jvm
        artifact: krypt-x509-jvm
        task: ":krypt-x509:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-x509-wasm-js
        artifact: krypt-x509-wasm-js
        task: ":krypt-x509:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-x509
        artifact: krypt-x509
        task: ":krypt-x509:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-keystore-jvm
        artifact: krypt-keystore-jvm
        task: ":krypt-keystore:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-keystore-wasm-js
        artifact: krypt-keystore-wasm-js
        task: ":krypt-keystore:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-keystore
        artifact: krypt-keystore
        task: ":krypt-keystore:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-ct-jvm
        artifact: krypt-ct-jvm
        task: ":krypt-ct:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-ct-wasm-js
        artifact: krypt-ct-wasm-js
        task: ":krypt-ct:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-ct
        artifact: krypt-ct
        task: ":krypt-ct:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-ocsp-jvm
        artifact: krypt-ocsp-jvm
        task: ":krypt-ocsp:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-ocsp-wasm-js
        artifact: krypt-ocsp-wasm-js
        task: ":krypt-ocsp:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-ocsp
        artifact: krypt-ocsp
        task: ":krypt-ocsp:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-testing-jvm
        artifact: krypt-testing-jvm
        task: ":krypt-testing:publishJvmPublicationToDavilsRepository"
      - path: com/davils/krypt-testing-wasm-js
        artifact: krypt-testing-wasm-js
        task: ":krypt-testing:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/krypt-testing
        artifact: krypt-testing
        task: ":krypt-testing:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/krypt-bom
        artifact: krypt-bom
        task: ":krypt-bom:publishMavenPublicationToDavilsRepository"
  attest:
    subjects:
      - "krypt-core/build/libs/*.jar"
      - "krypt-core/build/libs/*.klib"
      - "krypt-asn1/build/libs/*.jar"
      - "krypt-asn1/build/libs/*.klib"
      - "krypt-primitive/build/libs/*.jar"
      - "krypt-primitive/build/libs/*.klib"
      - "krypt-keyset/build/libs/*.jar"
      - "krypt-keyset/build/libs/*.klib"
      - "krypt-stream/build/libs/*.jar"
      - "krypt-stream/build/libs/*.klib"
      - "krypt-storage/build/libs/*.jar"
      - "krypt-storage/build/libs/*.klib"
      - "krypt-x509/build/libs/*.jar"
      - "krypt-x509/build/libs/*.klib"
      - "krypt-keystore/build/libs/*.jar"
      - "krypt-keystore/build/libs/*.klib"
      - "krypt-ct/build/libs/*.jar"
      - "krypt-ct/build/libs/*.klib"
      - "krypt-ocsp/build/libs/*.jar"
      - "krypt-ocsp/build/libs/*.klib"
      - "krypt-testing/build/libs/*.jar"
      - "krypt-testing/build/libs/*.klib"
  github-release:
    enabled: false

# How a pull request of Dependabot repairs itself, see CONTRIBUTING.md, "Changing a Dependency".
dependencies:
  lock:
    invocations:
      - ["kreateResolveAndLockAll", "--write-locks", "--no-configuration-cache"]
  verification:
    tasks: [check]
